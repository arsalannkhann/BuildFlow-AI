# Production on the VM (replaces Cloud Run — see infrastructure/staging-vm.md history).
# All state lives in Cloud SQL + GCS; these containers are disposable.
services:
  sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
    command: ["--address", "0.0.0.0", "--port", "5432", "buildflow-ai-502915:asia-south1:buildflow-pg"]
    restart: always

  web:
    build: { context: ., target: web }
    env_file: /etc/buildflow/production.env
    restart: always
    depends_on: [sql-proxy]
    ports: ["3000:8080"]   # direct check port; public traffic enters via caddy

  worker:
    build: { context: ., target: worker }
    env_file: /etc/buildflow/production.env
    restart: always
    depends_on: [sql-proxy]

  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

volumes:
  caddy-data:
  caddy-config:
